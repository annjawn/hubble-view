[project]
name = "harness-metrics-backend"
version = "0.1.0"
description = "Local data service for Hubble"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "kiro-usage==0.1.3",
  "platformdirs>=4.3.0",
  "pydantic-settings>=2.10.0",
  "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.16.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_metrics"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
python-preference = "only-managed"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Explicit and narrow on purpose: import errors, syntax errors, pyflakes,
# likely bugs, and import order. Ruff's default set is far broader.
select = ["E4", "E9", "F", "B", "I"]
