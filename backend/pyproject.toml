[project]
name = "harness-metrics-backend"
version = "0.1.0"
description = "Local data service for Hubble"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "platformdirs>=4.3.0",
  "pydantic-settings>=2.10.0",
  "uvicorn>=0.35.0",
]

[dependency-groups]
dev = ["pytest>=8.4.0", "pytest-asyncio>=1.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_metrics"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
